<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="api-base" content="https://modelgenx.site" />
<title>Sign in — Model Gen X</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@300..600&family=JetBrains+Mono:wght@400..600&family=Cairo:wght@300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/main.css" />
<link rel="stylesheet" href="../css/app.css" />
</head>
<body>
<div class="auth-wrap">
    <aside class="auth-art">
        <a class="brand" href="../index.html">
            <span class="brand-mark"></span>
            <strong>Model Gen X</strong>
        </a>
        <blockquote class="auth-quote">
            Describe what you want to predict.<br/>
            <em>Get a trained model back.</em><br/>
            That's the whole thing.
        </blockquote>
        <div class="auth-quote-by">/ smart-automl-agent · 2026</div>
    </aside>

    <section class="auth-panel">
        <div class="auth-panel-inner">
            <h1 class="display">Sign in.</h1>
            <p class="auth-sub">Welcome back. Pick up where you left off.</p>

            <button class="btn btn-google" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.79 2.72v2.26h2.9c1.7-1.56 2.69-3.86 2.69-6.62z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.97v2.33A9 9 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.65 9c0-.59.1-1.16.29-1.7V4.96H.97A9 9 0 0 0 0 9c0 1.45.35 2.82.97 4.04l2.98-2.34z"/>
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.97 4.96l2.98 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
                </svg>
                Continue with Google
            </button>

            <div id="msgBox" style="display:none;margin-top:16px;padding:12px 16px;border-radius:10px;font-size:14px;"></div>
        </div>
    </section>
</div>

<script src="../js/common.js?v=2"></script>
<script>
(function () {
    // ── 1. Handle Google OAuth redirect: #token=<jwt> ──────────────────
    var fragment = location.hash;
    if (fragment && fragment.startsWith('#token=')) {
        var jwt = fragment.slice(7);
        if (jwt) {
            localStorage.setItem('saa.token', jwt);
            history.replaceState(null, '', location.pathname + location.search);
            location.href = 'dashboard.html';
            return;
        }
    }

    // ── 2. Already logged in → go to dashboard ─────────────────────────
    if (localStorage.getItem('saa.token')) {
        location.href = 'dashboard.html';
        return;
    }

    // ── 3. Google button → redirect to backend OAuth flow ──────────────
    document.getElementById('googleBtn').addEventListener('click', function () {
        localStorage.setItem('saa.frontend_origin', location.origin);
        location.href = 'https://modelgenx.site/api/auth/google/login';
    });
})();
</script>
</body>
</html>
